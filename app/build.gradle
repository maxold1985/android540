plugins { id 'com.android.application' }

android {
    namespace 'com.example.vulkanwrapper'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.example.vulkanwrapper'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}
